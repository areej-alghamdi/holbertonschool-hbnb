<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
       <img src="images/logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>
    
    <main>
        <section id="filter">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                
            </select>
        </section>

        <section id="places-list">
            <!-- Card 1 -->
            <article class="place-card">
                <img src="images/image1.jpg" alt="Cozy Beachhouse" class="place-img">
                <div class="place-info">
                    <h3>Cozy Beachhouse</h3>
                    <p>Price: $150 / night</p>
                    <a href="place.html?id=1" class="details-button">View Details</a>
                </div>
            </article>
            
            <!-- Card 2 -->
            <article class="place-card">
                <img src="images/image2.jpg" alt="City Center Apartment" class="place-img">
                <div class="place-info">
                    <h3>City Center Apartment</h3>
                    <p>Price: $90 / night</p>
                    <a href="place.html?id=2" class="details-button">View Details</a>
                </div>
            </article>

            <!-- Card 3 -->
            <article class="place-card">
                
                <img src="images/image3.jpg" alt="Corniche Luxury Resort" class="place-img">
                <div class="place-info">
                    <h3>Corniche Luxury Resort</h3>
                    <p>Price: $200 / night</p>
                      <a href="place.html?id=3" class="details-button">View Details</a>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 All rights reserved.</p>
    </footer>
     <script src="scripts.js"></script>
</body>
</html>
